<script>

 */
const firebaseConfig = {
  apiKey: "AIzaSyB6H2x5EGWgcOZhdC69tbPqhoCM7Yu-gBQ",

  databaseURL: "https://nesshi-default-rtdb.firebaseio.com",

  storageBucket: "nesshi.firebasestorage.app",
  messagingSenderId: "88541623389",
  appId: "1:88541623389:web:978336bce7727b22c0c9b4",

};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/**
 * -------------------------------------------------------------
 * カード定義（全36枚）
 * -------------------------------------------------------------
 */
const ATTRIBUTES = [
  { name: "色", icon: "🎨", ex: "「中がイエロー」「最初はブルー」など" },
  { name: "長さ", icon: "📏", ex: "「小学1年生の身長くらい」「時間がたつと縮む」など" },
  { name: "時", icon: "⏰", ex: "「夏によく見る」「江戸時代にあった」など" },
  { name: "かたち", icon: "🔷", ex: "「下から見ると丸い」「決まった形はない」など" },
  { name: "音", icon: "👂", ex: "「音は出ない」「叩くと大きい音がする」など" },
  { name: "におい", icon: "👃", ex: "「使った後はくさい」「おいしそう」など" },
  { name: "重量", icon: "⚖️", ex: "「リンゴ1個分くらい」「水に浮く」など" },
  { name: "広さ・大きさ", icon: "📐", ex: "「この部屋に入るくらい」「手のひらにのる」など" },
  { name: "味・食", icon: "👅", ex: "「知らないけどたぶん苦い」「危険」など" },
  { name: "手ざわり", icon: "✋", ex: "「痛い！」「ゴツゴツ」など" },
  { name: "かたさ", icon: "🔨", ex: "「強くたたくと壊れる」「ぷよぷよ」など" },
  { name: "価値", icon: "💰", ex: "「高級な車が買えるくらい」「わからない人にはゴミ」など" }
];

function createFullDeck() {
  const deck = [];
  ATTRIBUTES.forEach(attr => {
    deck.push({
      category: 'HOW',
      categoryName: '「どんな？」カード',
      attrName: attr.name,
      icon: attr.icon,
      badgeColor: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
      desc: `正体の【${attr.name}】について口頭で質問してください。\n（例: ${attr.ex}）`
    });
  });
  ATTRIBUTES.forEach(attr => {
    deck.push({
      category: 'YESNO_MARKED',
      categoryName: 'マークあり「YES / NO」カード',
      attrName: attr.name,
      icon: attr.icon,
      badgeColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
      desc: `【${attr.name}】に関連して、目撃者が「YES」か「NO」で答えられる質問を口頭でしてください。`
    });
  });
  for (let i = 0; i < 12; i++) {
    deck.push({
      category: 'YESNO_FREE',
      categoryName: '自由質問「YES / NO」カード',
      attrName: '自由質問',
      icon: '❓',
      badgeColor: 'bg-sky-500/20 text-sky-300 border-sky-500/40',
      desc: 'マークの縛りはありません！目撃者が「YES」または「NO」で答えられる質問を自由に口頭でしてください。'
    });
  }
  return shuffle(deck);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * -------------------------------------------------------------
 * 状態管理
 * -------------------------------------------------------------
 */
let currentRoomId = null;
let myPlayerId = localStorage.getItem('nessie_pid') || 'p_' + Math.random().toString(36).substring(2, 9);
localStorage.setItem('nessie_pid', myPlayerId);

let myName = localStorage.getItem('nessie_pname') || '';
let roomData = null;
let roomRef = null;

let localTyping = { inference: '', secretWord: '' };
const appEl = document.getElementById('app');

// URLパラメータからルームコードを取得
const urlParams = new URLSearchParams(window.location.search);
let invitedRoomCode = urlParams.get('room') ? urlParams.get('room').toUpperCase() : '';

function render() {
  if (!currentRoomId || !roomData) {
    renderTitleScreen();
    return;
  }

  updateHeader();
  const phase = roomData.state?.phase;

  // 推理入力フェーズ中、すでに入力欄が存在する場合はDOMを再生成せずステータス表示のみ更新（文字消え防止）
  if (phase === 'INFERENCE_INPUT') {
    const inputEl = document.getElementById('inputInferenceText');
    if (inputEl) {
      updateInferenceWaitingStatus();
      return;
    }
  }

  switch (phase) {
    case 'LOBBY': renderLobbyScreen(); break;
    case 'SETUP': renderSetupScreen(); break;
    case 'QUESTION_CHOOSE':
    case 'QUESTION_ORAL': renderQuestionScreen(); break;
    case 'INFERENCE_INPUT': renderInferenceInputScreen(); break;
    case 'INFERENCE_REVEAL':
    case 'INFERENCE_JUDGE': renderInferenceJudgeScreen(); break;
    case 'SHIP_MOVE': renderShipMoveScreen(); break;
    case 'SCOOP_VOTE_GUESSER': renderScoopVoteGuesserScreen(); break;
    case 'SCOOP_RESULT_GUESSER': renderScoopResultGuesserScreen(); break;
    case 'INSIDER_VOTE': renderInsiderVoteScreen(); break;
    case 'INSIDER_REVEAL': renderInsiderRevealScreen(); break;
    case 'ROUND_RESULT': renderRoundResultScreen(); break;
    case 'SET_COMPLETE': renderSetCompleteScreen(); break;
    default: renderLobbyScreen(); break;
  }
}

function updateHeader() {
  const el = document.getElementById('headerInfo');
  if (!currentRoomId || !roomData) { el.innerHTML = ''; return; }
  const isHost = roomData.hostId === myPlayerId;
  el.innerHTML = `
    <span class="bg-emerald-900/90 px-2 py-0.5 rounded border border-emerald-700 font-mono text-emerald-200">Room: ${currentRoomId}</span>
    <span class="text-slate-300 font-bold">${escapeHtml(myName)}</span>
    ${isHost ? '<span class="bg-amber-500/20 text-amber-300 text-[10px] px-1.5 py-0.5 rounded border border-amber-500/40">HOST</span>' : ''}
  `;
}

function renderLakeTrackComponent() {
  const pos = roomData.state?.boatPos ?? 0;
  const isReached = pos >= 10;
  const percentage = Math.min(84, Math.max(2, (pos / 10) * 80));

  return `
    <div class="bg-slate-950/80 border border-sky-800/60 p-3.5 rounded-2xl shadow-inner mb-3">
      <div class="flex justify-between items-center text-xs font-bold text-sky-300 mb-2 px-1">
        <span>⛵ ボート（位置: ${pos}）</span>
        <span class="text-slate-400 text-[11px]">${isReached ? '✨ 湖（正解）に到達！' : '正体との距離感'}</span>
        <span>🦕 ネッシー</span>
      </div>
      <div class="relative w-full h-12 bg-sky-950 rounded-xl border border-sky-700/60 flex items-center px-2 overflow-hidden shadow-inner">
        <div class="absolute inset-0 bg-gradient-to-r from-sky-900/30 via-teal-900/20 to-sky-900/40 pointer-events-none"></div>
        <div class="absolute transition-all duration-500 ease-out flex flex-col items-center z-10" style="left: ${percentage}%;">
          <span class="text-2xl drop-shadow-md">⛵</span>
        </div>
        <div class="absolute right-2 flex flex-col items-center z-0">
          <span class="text-3xl ${isReached ? 'animate-bounce' : 'opacity-90'}">🦕</span>
        </div>
      </div>
    </div>
  `;
}

/**
 * 1. タイトル画面（招待URLの自動入力対応）
 */
function renderTitleScreen() {
  const initialCode = invitedRoomCode;

  appEl.innerHTML = `
    <div class="bg-slate-800/90 border border-slate-700 p-6 rounded-3xl shadow-2xl backdrop-blur">
      <div class="text-center mb-8">
        <div class="text-6xl animate-bounce">🦕🌊⛵</div>
        <h2 class="text-2xl font-black text-emerald-300 mt-3 tracking-wide">ネッシーの正体 オンライン</h2>
        <p class="text-xs text-slate-400 mt-1">霧深きネス湖で、正体不明の影を暴け！</p>
      </div>

      ${initialCode ? `
        <div class="mb-4 p-3 bg-emerald-950/70 border border-emerald-600 rounded-2xl text-center">
          <span class="text-xs text-emerald-300 font-bold">招待ルーム [ ${initialCode} ] を読み込みました！</span>
          <p class="text-[11px] text-slate-300 mt-0.5">名前を入力して「参加」を押してください。</p>
        </div>
      ` : ''}

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">あなたの探検家名</label>
          <input id="inputPlayerName" type="text" maxlength="10" value="${escapeHtml(myName)}" placeholder="名前（最大10文字）" 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:border-emerald-500 outline-none">
        </div>

        <div class="pt-2 border-t border-slate-700/60">
          <button onclick="handleCreateRoom()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
            <span>✨</span> 新しい調査ルームを作成
          </button>
        </div>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-700"></div>
          <span class="flex-shrink mx-4 text-xs text-slate-500">または</span>
          <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <div class="flex gap-2">
          <input id="inputRoomCode" type="text" maxlength="6" value="${initialCode}" placeholder="6桁コード"
            class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm font-mono tracking-widest text-center uppercase focus:border-emerald-500 outline-none">
          <button onclick="handleJoinRoom()" class="bg-sky-600 hover:bg-sky-500 active:scale-95 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg">
            参加
          </button>
        </div>
      </div>
    </div>
  `;
}

/**
 * 2. ロビー画面（招待URLコピーボタン完備）
 */
function renderLobbyScreen() {
  const isHost = roomData.hostId === myPlayerId;
  const players = Object.values(roomData.players || {});
  const playerCount = players.length;

  let playerListHtml = players.map(p => {
    const isMe = p.id === myPlayerId;
    const isH = p.id === roomData.hostId;
    return `
      <div class="flex items-center justify-between p-3 rounded-xl ${isMe ? 'bg-emerald-950/50 border border-emerald-700/50' : 'bg-slate-900/60 border border-slate-800'}">
        <div class="flex items-center gap-2">
          <span class="text-lg">${isH ? '👑' : '🧭'}</span>
          <span class="font-bold text-sm ${isMe ? 'text-emerald-300' : 'text-slate-200'}">${escapeHtml(p.name)}</span>
          ${isMe ? '<span class="text-[10px] bg-emerald-800 text-emerald-200 px-1.5 py-0.5 rounded">あなた</span>' : ''}
        </div>
        <div class="text-xs text-slate-400">
          累計: <span class="font-bold text-amber-400">${p.score || 0}</span> 点
        </div>
      </div>
    `;
  }).join('');

  appEl.innerHTML = `
    <div class="bg-slate-800 border border-slate-700 p-5 rounded-3xl shadow-xl space-y-5">
      <div class="text-center border-b border-slate-700 pb-4">
        <span class="text-xs text-slate-400 font-bold">合言葉（ルームコード）</span>
        <div class="text-3xl font-mono font-black text-emerald-400 tracking-widest mt-1">
          ${currentRoomId}
        </div>
        <div class="flex justify-center gap-2 mt-3">
          <button onclick="copyInviteUrl()" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-white text-xs font-bold rounded-xl shadow flex items-center gap-1.5">
            <span>🔗</span> 招待URLをコピー
          </button>
          <button onclick="copyRoomCode()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-300 text-xs font-bold rounded-xl">
            コードのみコピー
          </button>
        </div>
        <p class="text-[11px] text-slate-400 mt-2">招待URLを送れば、友達はコード入力なしで入れます</p>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2 px-1">
          <span class="text-xs font-bold text-slate-300">参加探検隊員 (${playerCount}/8人)</span>
          <span class="text-xs text-emerald-400 font-semibold">${playerCount >= 4 ? '準備完了' : 'あと ' + (4 - playerCount) + '人必要'}</span>
        </div>
        <div class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar">
          ${playerListHtml}
        </div>
      </div>

      <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-700">
        <label class="block text-xs font-bold text-slate-300 mb-2">ゲームモード</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="${isHost ? "setGameMode('NORMAL')" : ''}" 
            class="py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 ${roomData.mode === 'NORMAL' ? 'bg-emerald-600 border-emerald-400 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}">
            <span>🦕 通常モード</span>
            <span class="text-[10px] opacity-80">ネッシーの正体</span>
          </button>
          <button onclick="${isHost ? "setGameMode('INSIDER')" : ''}" 
            class="py-2.5 px-3 rounded-xl border text-xs font-bold transition flex flex-col items-center gap-1 ${roomData.mode === 'INSIDER' ? 'bg-purple-600 border-purple-400 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400'}">
            <span>🕵️ インサイダー</span>
            <span class="text-[10px] opacity-80">正体＋裏切り者</span>
          </button>
        </div>
      </div>

      ${isHost ? `
        <button onclick="handleStartGameSet()" ${playerCount < 4 ? 'disabled' : ''}
          class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 disabled:opacity-40 disabled:cursor-not-allowed text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg text-base">
          調査セットを開始する
        </button>
      ` : `
        <div class="text-center py-2 text-xs text-slate-400 animate-pulse">隊長が調査を開始するのを待機中...</div>
      `}

      <button onclick="handleLeaveRoom()" class="w-full text-center text-xs text-rose-400 hover:text-rose-300 pt-2">
        ルームを退出する
      </button>
    </div>
  `;
}

/**
 * 3. セットアップ画面
 */
function renderSetupScreen() {
  const isWitness = roomData.state.witnessId === myPlayerId;
  const isInsider = roomData.mode === 'INSIDER' && roomData.state.insiderId === myPlayerId;
  const witnessName = roomData.players[roomData.state.witnessId]?.name || '目撃者';

  appEl.innerHTML = `
    <div class="bg-slate-800 border border-slate-700 p-5 rounded-3xl shadow-xl space-y-4">
      <div class="p-4 rounded-2xl text-center border ${
        isWitness ? 'bg-amber-950/60 border-amber-600/60 text-amber-200' :
        isInsider ? 'bg-purple-950/60 border-purple-600/60 text-purple-200' :
        'bg-sky-950/60 border-sky-600/60 text-sky-200'
      }">
        <span class="text-xs uppercase font-bold tracking-wider opacity-75">あなたの役割</span>
        <div class="text-2xl font-black mt-1">
          ${isWitness ? '👀 あなたは【目撃者】です' : isInsider ? '🕵️ あなたは【インサイダー】です' : '📰 あなたは【一般記者】です'}
        </div>
        <p class="text-xs mt-1.5 opacity-90">
          ${isWitness ? 'ネッシーの正体を決めてください。誰もが知っている名詞にしましょう。' :
            isInsider ? '正体を知りながら、自分がインサイダーだとバレないように誘導してください。' :
            '質問を重ねて、ネッシーの正体を暴いてください。'}
        </p>
      </div>

      ${isWitness ? `
        <div class="space-y-4 bg-slate-900/80 p-4 rounded-2xl border border-slate-700">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">ネッシーの正体（例: パイナップル、タイヤ、信号機）</label>
            <input id="inputSecretWord" type="text" maxlength="20" placeholder="正体の言葉" 
              value="${escapeHtml(localTyping.secretWord)}"
              oninput="localTyping.secretWord = this.value"
              class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:border-amber-500 outline-none">
          </div>
          <button onclick="submitSetup()" class="w-full bg-amber-600 hover:bg-amber-500 active:scale-95 text-slate-950 font-black py-3.5 rounded-xl transition shadow-lg text-sm">
            正体を決定して調査開始！
          </button>
        </div>
      ` : `
        <div class="text-center py-10 space-y-3 bg-slate-900/60 rounded-2xl border border-slate-800">
          <div class="text-4xl animate-pulse">⛵ ... 🦕</div>
          <p class="text-sm font-bold text-slate-300">目撃者（${escapeHtml(witnessName)}）が正体を考え中...</p>
          <p class="text-xs text-slate-500">決定すると自動的に質問フェーズへ進みます</p>
        </div>
      `}
    </div>
  `;
}

/**
 * 4. 質問画面（質問者だけがボタンを押すワンタップ進行）
 */
function renderQuestionScreen() {
  const isWitness = roomData.state.witnessId === myPlayerId;
  const isInsider = roomData.mode === 'INSIDER' && roomData.state.insiderId === myPlayerId;
  const state = roomData.state;
  const currentAskerId = state.questionQueue[state.currentQuestionIndex];
  const isMyTurn = currentAskerId === myPlayerId;
  const askerName = roomData.players[currentAskerId]?.name || '記者';
  const card = state.currentQuestionCard;

  appEl.innerHTML = `
    <div class="space-y-3">
      ${renderLakeTrackComponent()}

      <div class="bg-slate-800 border border-slate-700 p-5 rounded-3xl shadow-xl space-y-4">
        <div class="flex items-center justify-between border-b border-slate-700 pb-3">
          <div class="text-xs">
            <span class="text-emerald-400 font-bold">第 ${state.roundNumber} 周目</span>
            <span class="text-slate-400">（質問 ${state.currentQuestionIndex + 1} / ${state.questionQueue.length}）</span>
          </div>
          ${(isWitness || isInsider) ? `
            <div class="text-xs bg-amber-950 text-amber-300 border border-amber-700 px-2 py-0.5 rounded-full font-bold">
              正体: ${escapeHtml(state.secretWord)}
            </div>
          ` : ''}
        </div>

        ${state.phase === 'QUESTION_CHOOSE' ? `
          ${isMyTurn ? `
            <div class="space-y-3">
              <div class="text-center">
                <span class="text-xs font-bold text-emerald-400">あなたの質問番です！</span>
                <p class="text-xs text-slate-400 mt-0.5">${isInsider ? 'インサイダーは自由にカードを選べます' : '山札からカードを引いてください'}</p>
              </div>

              ${isInsider ? `
                <div class="space-y-2 max-h-56 overflow-y-auto custom-scrollbar p-1">
                  <button onclick="handleInsiderPickCard('YESNO_FREE', '自由質問')" class="w-full p-2.5 bg-sky-950/80 border border-sky-600 rounded-xl text-left text-xs hover:bg-sky-900 flex items-center justify-between">
                    <span class="font-bold text-sky-200">❓ 自由質問「YES / NO」カード</span>
                    <span class="text-[10px] text-sky-400">選択 ➔</span>
                  </button>
                  <div class="text-[11px] font-bold text-slate-400 mt-2">マークあり YES/NO カード</div>
                  <div class="grid grid-cols-2 gap-1.5">
                    ${ATTRIBUTES.map(attr => `
                      <button onclick="handleInsiderPickCard('YESNO_MARKED', '${attr.name}')" class="p-2 bg-emerald-950/60 border border-emerald-700/60 rounded-lg text-left text-xs hover:bg-emerald-900 truncate">
                        ${attr.icon} <span class="font-bold text-emerald-200">${attr.name}</span>
                      </button>
                    `).join('')}

/**
 * 9. 正解者投票結果
 */
function renderScoopResultGuesserScreen() {
  const isHost = roomData.hostId === myPlayerId;
  const votes = roomData.state.guesserVotes || {};
  const reporters = Object.keys(roomData.players).filter(pid => pid !== roomData.state.witnessId);
  const correctPids = Object.entries(roomData.state.inferences || {})
    .filter(([_, inf]) => inf.isCorrect)
    .map(([pid]) => pid);

  const voteCounts = {};
  reporters.forEach(pid => voteCounts[pid] = 0);
  Object.values(votes).forEach(target => {
    voteCounts[target] = (voteCounts[target] || 0) + 1;
  });

  let correctTargetVotes = 0;
  Object.entries(votes).forEach(([voter, target]) => {
    if (correctPids.includes(target)) correctTargetVotes++;
  });

  const threshold = Math.floor(reporters.length / 2) + 1;
  const isGuesserIdentified = correctTargetVotes >= threshold;

  appEl.innerHTML = `
    <div class="space-y-3">
      ${renderLakeTrackComponent()}

      <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl shadow-xl space-y-5 text-center">
        <div>
          <span class="text-xs font-bold text-emerald-400">スクープ会議 投票結果</span>
          <h2 class="text-xl font-black text-slate-100 mt-1">誰が正解を当てていたか？</h2>
        </div>

        <div class="space-y-2 text-left">
          ${reporters.map(pid => {
            const isActuallyCorrect = correctPids.includes(pid);
            const cnt = voteCounts[pid] || 0;
            return `
              <div class="p-3 bg-slate-900 border ${isActuallyCorrect ? 'border-amber-500 bg-amber-950/20' : 'border-slate-800'} rounded-xl flex justify-between items-center">
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-sm text-slate-200">${escapeHtml(roomData.players[pid].name)}</span>
                    ${isActuallyCorrect ? '<span class="text-[10px] bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded font-black">正解者！⭕</span>' : ''}
                  </div>
                  <div class="text-xs text-slate-400 mt-0.5">推理: 「${escapeHtml(roomData.state.inferences[pid]?.text || '')}」</div>
                </div>
                <div class="font-mono font-bold text-base text-amber-400">${cnt} 票</div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="p-4 rounded-2xl border text-center ${
          isGuesserIdentified ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200' : 'bg-rose-950/80 border-rose-500 text-rose-200'
        }">
          <div class="text-2xl font-black mb-1">
            ${isGuesserIdentified ? '🎉 正解者の特定に成功！' : '😱 正解者を特定できず！'}
          </div>
          <p class="text-xs opacity-90 leading-relaxed">
            正解者への投票数: <b>${correctTargetVotes}票</b> / 必要数: <b>${threshold}票</b>（記者の半数超）<br>
            ${isGuesserIdentified ? 
              (roomData.mode === 'INSIDER' ? '第2段階：インサイダー当て投票へ進みます！' : '記者チームの勝利です！') : 
              '正体は永遠の謎となり、目撃者の勝利です！'}
          </p>
        </div>

        ${isHost ? `
          <button onclick="handleProceedAfterGuesserVote(${isGuesserIdentified})" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-black py-3.5 rounded-xl shadow-lg text-sm">
            ${roomData.mode === 'INSIDER' && isGuesserIdentified ? 'インサイダー投票へ進む ➔' : 'ラウンド結果へ進む ➔'}

        ` : `
          <div class="text-xs text-slate-400 animate-pulse">隊長が次へ進めるのを待機中...</div>
        `}
      </div>
    </div>
  `;
}

    <div class="bg-slate-800 border border-purple-500 p-6 rounded-3xl shadow-xl space-y-5">
      <div class="text-center">
        <h2 class="text-lg font-black text-purple-300">インサイダー投票結果</h2>
      </div>

      <div class="space-y-2">
        ${Object.entries(voteCounts).map(([pid, cnt]) => `
          <div class="p-3 bg-slate-900 border border-slate-700 rounded-xl flex justify-between items-center">
            <span class="font-bold text-sm text-slate-200">${escapeHtml(roomData.players[pid]?.name || '')}</span>
            <span class="font-mono font-bold text-purple-400 text-sm">${cnt} 票</span>
          </div>
        `).join('')}
      </div>

      ${isTie ? `
        <div class="p-4 bg-amber-950/60 border border-amber-600 rounded-2xl text-xs space-y-2">
          <span class="font-bold text-amber-300">⚠️ 最多得票が同数です！</span>
          <p class="text-slate-300">話し合いを行い、最終的に目撃者が1名を指名してください。</p>
          ${isWitness ? `
            <div class="grid grid-cols-1 gap-2 pt-2">
              ${topCandidates.map(pid => `
                <button onclick="handleResolveInsiderRound('${pid}')" class="p-2.5 bg-amber-600 text-slate-950 font-bold rounded-lg text-xs">
                  ${escapeHtml(roomData.players[pid]?.name || '')} を指名する
                </button>
              `).join('')}
            </div>
          ` : '<p class="text-slate-400 text-center py-2 animate-pulse">目撃者の指名待機中...</p>'}
        </div>
      ` : `
        ${isWitness ? `
          <button onclick="handleResolveInsiderRound('${topCandidates[0]}')" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-3 rounded-xl transition text-sm">
            結果を確定して終了へ
          </button>
        ` : '<p class="text-center text-xs text-slate-400 animate-pulse">目撃者が確認中...</p>'}
      `}
    </div>
  `;
}

/**
 * 12. ラウンド結果
 */
function renderRoundResultScreen() {
  const isHost = roomData.hostId === myPlayerId;
  const state = roomData.state;
  const res = state.roundSummary;

  appEl.innerHTML = `
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl shadow-xl space-y-5 text-center">
      <div>
        <span class="text-xs text-emerald-400 font-bold">第 ${state.roundNumber} 回 調査終了</span>
        <h2 class="text-xl font-black text-slate-100 mt-1">結果発表</h2>
      </div>

      <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700 text-left text-xs space-y-2">
        <div class="flex justify-between">
          <span class="text-slate-400">ネッシーの正体:</span>
          <span class="font-bold text-amber-400 text-sm">${escapeHtml(state.secretWord)}</span>
        </div>
        ${roomData.mode === 'INSIDER' ? `
          <div class="flex justify-between">
            <span class="text-slate-400">インサイダー:</span>
            <span class="font-bold text-purple-400 text-sm">${escapeHtml(roomData.players[state.insiderId]?.name || 'なし')}</span>
          </div>
        ` : ''}
        <div class="pt-2 border-t border-slate-800 text-slate-300">${res?.reason || ''}</div>
      </div>

      <div class="space-y-2 text-left">
        <span class="text-xs font-bold text-slate-300">今回獲得した得点:</span>
        <div class="space-y-1.5">
          ${Object.entries(res?.scores || {}).map(([pid, pts]) => `
            <div class="flex justify-between items-center p-2.5 bg-slate-900 rounded-xl text-xs">
              <span class="font-bold text-slate-200">${escapeHtml(roomData.players[pid]?.name || '')}</span>
              <span class="font-black text-emerald-400 font-mono">+${pts} 点</span>
            </div>
          `).join('')}
        </div>
      </div>

      ${isHost ? `
        <button onclick="handleNextRoundOrEnd()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg text-sm">
          ${state.roundNumber >= Object.keys(roomData.players).length ? '最終結果へ' : '次のラウンドへ'}
        </button>
      ` : `
        <div class="text-xs text-slate-400 animate-pulse">隊長が次へ進めるのを待機中...</div>
      `}
    </div>
  `;
}

/**
 * 13. 最終ランキング
 */
function renderSetCompleteScreen() {
  const isHost = roomData.hostId === myPlayerId;
  const players = Object.values(roomData.players || {});
  players.sort((a, b) => (b.score || 0) - (a.score || 0));

  let currentRank = 1;
  const rankedList = players.map((p, idx) => {
    if (idx > 0 && p.score < players[idx - 1].score) currentRank = idx + 1;
    const isMe = p.id === myPlayerId;
    return `
      <div class="flex items-center justify-between p-3.5 rounded-2xl ${
        currentRank === 1 ? 'bg-amber-950/40 border border-amber-500/60' :
        isMe ? 'bg-emerald-950/40 border border-emerald-700/60' : 'bg-slate-900 border border-slate-800'
      }">
        <div class="flex items-center gap-3">
          <span class="font-black text-lg w-6 text-center ${currentRank === 1 ? 'text-amber-400 text-xl' : 'text-slate-400'}">
            ${currentRank === 1 ? '👑' : currentRank}
          </span>
          <span class="font-bold text-sm ${isMe ? 'text-emerald-300' : 'text-slate-200'}">${escapeHtml(p.name)}</span>
        </div>
        <div class="font-mono font-black text-amber-400 text-base">${p.score || 0} 点</div>
      </div>
    `;
  }).join('');

  appEl.innerHTML = `
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl shadow-2xl space-y-6 text-center">
      <div>
        <span class="text-5xl">🏆</span>
        <h2 class="text-2xl font-black text-amber-300 mt-2">ゲームセット終了！</h2>
      </div>

      <div class="space-y-2 text-left">${rankedList}</div>

      ${isHost ? `
        <button onclick="handleStartGameSet()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-extrabold py-3.5 rounded-2xl transition text-sm">
          もう1セット遊ぶ
        </button>
      ` : ''}
    </div>
  `;
}

/**
 * -------------------------------------------------------------
 * ネットワーク＆ロジック操作
 * -------------------------------------------------------------
 */
function handleCreateRoom() {
  const name = document.getElementById('inputPlayerName').value.trim();
  if (!name) return showToast('名前を入力してください');
  myName = name;
  localStorage.setItem('nessie_pname', myName);

  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  currentRoomId = code;
  roomRef = db.ref('rooms/' + code);

  roomRef.set({
    code: code,
    hostId: myPlayerId,
    mode: 'NORMAL',
    state: { phase: 'LOBBY' },
    players: { [myPlayerId]: { id: myPlayerId, name: myName, score: 0, online: true } }
  }).then(() => attachRoomListener()).catch(e => showToast(e.message));
}

function handleJoinRoom() {
  const name = document.getElementById('inputPlayerName').value.trim();
  const code = document.getElementById('inputRoomCode').value.trim().toUpperCase();
  if (!name) return showToast('名前を入力してください');
  if (!code || code.length !== 6) return showToast('6桁のコードを入力してください');

  myName = name;
  localStorage.setItem('nessie_pname', myName);
  currentRoomId = code;
  roomRef = db.ref('rooms/' + code);

  roomRef.get().then(snap => {
    if (!snap.exists()) return showToast('ルームが見つかりません');
    const data = snap.val();
    if (Object.keys(data.players || {}).length >= 8 && !data.players[myPlayerId]) return showToast('満員です');

    roomRef.child('players/' + myPlayerId).set({
      id: myPlayerId,
      name: myName,
      score: data.players?.[myPlayerId]?.score || 0,
      online: true
    }).then(() => attachRoomListener());
  }).catch(e => showToast(e.message));
}

function attachRoomListener() {
  roomRef.child('players/' + myPlayerId).onDisconnect().update({ online: false });

  roomRef.on('value', snap => {
    if (!snap.exists()) {
      showToast('ルームが解散されました');
      currentRoomId = null; roomData = null; render(); return;
    }
    roomData = snap.val();

    if (!roomData.players[roomData.hostId]?.online) {
      const activeIds = Object.keys(roomData.players).filter(id => roomData.players[id].online);
      if (activeIds.length > 0 && activeIds[0] === myPlayerId) {
        roomRef.update({ hostId: myPlayerId });
      }
    }
    render();
  });
}

function setGameMode(mode) {
  if (roomData.hostId !== myPlayerId) return;
  roomRef.update({ mode: mode });
}

function handleStartGameSet() {
  const pids = Object.keys(roomData.players);
  if (pids.length < 4) return showToast('4人以上必要です');
  startRound(1, shuffle(pids));
}

function startRound(roundNum, witnessOrder) {
  const witnessId = witnessOrder[roundNum - 1];
  const candidates = witnessOrder.filter(id => id !== witnessId);
  const insiderId = candidates[Math.floor(Math.random() * candidates.length)];

  roomRef.update({
    'state': {
      phase: 'SETUP',
      roundNumber: roundNum,
      witnessOrder: witnessOrder,
      witnessId: witnessId,
      insiderId: insiderId,
      secretWord: '',
      boatPos: 0,
      deck: createFullDeck(),
      discard: [],
      currentQuestionIndex: 0,
      inferences: {},
      guesserVotes: {},
      votes: {}
    }
  });
}

function submitSetup() {
  const word = localTyping.secretWord.trim();
  if (!word) return showToast('正体の言葉を入力してください');

  const pids = Object.keys(roomData.players);
  const witnessId = roomData.state.witnessId;
  const nonWitnesses = pids.filter(id => id !== witnessId);
  const queue = shuffle(nonWitnesses).slice(0, Math.min(3, nonWitnesses.length));

  roomRef.child('state').update({
    phase: 'QUESTION_CHOOSE',
    secretWord: word,
    boatPos: 0,
    questionQueue: queue,
    currentQuestionIndex: 0
  });
}

function handleDrawCard() {
  let deck = [...(roomData.state.deck || [])];
  let discard = [...(roomData.state.discard || [])];

  if (deck.length === 0) {
    if (discard.length === 0) deck = createFullDeck();
    else { deck = shuffle(discard); discard = []; }
  }

  const drawn = deck.pop();
  discard.push(drawn);

  roomRef.child('state').update({
    phase: 'QUESTION_ORAL',
    deck: deck,
    discard: discard,
    currentQuestionCard: drawn
  });
}

function handleInsiderPickCard(category, attrName) {
  let c = { category: category, attrName: attrName };
  if (category === 'YESNO_FREE') {
    c.categoryName = '自由質問「YES / NO」カード';
    c.icon = '❓';
    c.badgeColor = 'bg-sky-500/20 text-sky-300 border-sky-500/40';
    c.desc = 'マークの縛りはありません！目撃者に自由にYES/NO質問を口頭でしてください。';
  } else if (category === 'YESNO_MARKED') {
    const a = ATTRIBUTES.find(x => x.name === attrName);
    c.categoryName = 'マークあり「YES / NO」カード';
    c.icon = a?.icon || '🔷';
    c.badgeColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
    c.desc = `【${attrName}】に関連して、目撃者がYESかNOで答えられる質問を口頭でしてください。`;
  } else {
    const a = ATTRIBUTES.find(x => x.name === attrName);
    c.categoryName = '「どんな？」カード';
    c.icon = a?.icon || '🎨';
    c.badgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
    c.desc = `正体の【${attrName}】について口頭で質問してください。\n（例: ${a?.ex || ''}）`;
  }

  roomRef.child('state').update({
    phase: 'QUESTION_ORAL',
    currentQuestionCard: c
  });
}

// 質問者だけが押して次に進める
function handleFinishQuestionTurn() {
  const nextIdx = roomData.state.currentQuestionIndex + 1;
  const isEnd = nextIdx >= roomData.state.questionQueue.length;

  if (isEnd) {
    localTyping.inference = '';
    roomRef.child('state').update({ phase: 'INFERENCE_INPUT', inferences: {} });
  } else {
    roomRef.child('state').update({
      phase: 'QUESTION_CHOOSE',
      currentQuestionIndex: nextIdx,
      currentQuestionCard: null
    });
  }
}

// 記者が推理を送信（目撃者は送信不要）
function handleSubmitInference() {
  const text = localTyping.inference.trim();
  if (!text) return showToast('推理を入力してください');

  roomRef.child('state/inferences/' + myPlayerId).set({
    text: text,
    isCorrect: null,
    isClosest: false
  }).then(() => {
    roomRef.child('state/inferences').get().then(snap => {
      const infs = snap.val() || {};
      const reporters = Object.keys(roomData.players).filter(id => id !== roomData.state.witnessId);
      // 目撃者以外の記者全員が送信したら公開へ
      if (Object.keys(infs).length >= reporters.length) {
        roomRef.child('state').update({ phase: 'INFERENCE_JUDGE' });
      }
    });
  });
}

function toggleJudgeCorrect(targetPid, boolVal) {
  roomRef.child(`state/inferences/${targetPid}`).update({ isCorrect: boolVal });
}

function setClosestAnswer(targetPid) {
  const inferences = roomData.state.inferences || {};
  const updates = {};
  Object.keys(inferences).forEach(pid => {
    updates[`state/inferences/${pid}/isClosest`] = (pid === targetPid);
  });
  roomRef.update(updates);
}

function finishJudging() {
  const inferences = roomData.state.inferences || {};
  const hasUnjudged = Object.values(inferences).some(inf => inf.isCorrect === null);
  if (hasUnjudged) return showToast('全員の回答に⭕または❌をつけてください');

  const hasCorrect = Object.values(inferences).some(inf => inf.isCorrect === true);

  if (hasCorrect) {
    // 正解が出たらボートを湖（10）へ移動してスクープ会議へ！
    roomRef.child('state').update({
      boatPos: 10,
      phase: 'SCOOP_VOTE_GUESSER',
      guesserVotes: {}
    });
  } else {
    // 正解がなければボート移動フェーズへ
    roomRef.child('state').update({ phase: 'SHIP_MOVE' });
  }
}

function handleAdjustBoat(delta) {
  const cur = roomData.state.boatPos ?? 0;
  const next = Math.max(0, Math.min(10, cur + delta));
  roomRef.child('state/boatPos').set(next);
}

function confirmBoatMoveAndProceed() {
  const maxRounds = 5;
  const curRound = roomData.state.roundNumber;

  if (curRound >= maxRounds) {
    const scores = {};
    Object.keys(roomData.players).forEach(pid => scores[pid] = 0);
    applyRoundScores(scores, '5つのヒントを終えても正解が出ませんでした。（全員0点）');
  } else {
    const pids = Object.keys(roomData.players);
    const nonWitnesses = pids.filter(id => id !== roomData.state.witnessId);
    const queue = shuffle(nonWitnesses).slice(0, Math.min(3, nonWitnesses.length));

    roomRef.child('state').update({
      phase: 'QUESTION_CHOOSE',
      roundNumber: curRound + 1,
      questionQueue: queue,
      currentQuestionIndex: 0,
      currentQuestionCard: null
    });
  }
}

function handleSubmitGuesserVote(targetPid) {
  roomRef.child('state/guesserVotes/' + myPlayerId).set(targetPid).then(() => {
    roomRef.child('state/guesserVotes').get().then(snap => {
      const votes = snap.val() || {};
      const reporterCount = Object.keys(roomData.players).length - 1;
      if (Object.keys(votes).length >= reporterCount) {
        roomRef.child('state').update({ phase: 'SCOOP_RESULT_GUESSER' });
      }
    });
  });
}

function handleProceedAfterGuesserVote(isGuesserIdentified) {
  if (roomData.mode === 'INSIDER') {
    if (isGuesserIdentified) {
      roomRef.child('state').update({ phase: 'INSIDER_VOTE', votes: {} });
    } else {
      const scores = {};
      Object.keys(roomData.players).forEach(pid => {
        scores[pid] = (pid === roomData.state.witnessId) ? 2 : 0;
      });
      applyRoundScores(scores, '正解者を特定できませんでした。（目撃者に2点）');
    }
  } else {
    const scores = {};
    const correctPids = Object.entries(roomData.state.inferences || {})
      .filter(([_, inf]) => inf.isCorrect)
      .map(([pid]) => pid);

    if (isGuesserIdentified) {
      Object.keys(roomData.players).forEach(pid => {
        scores[pid] = correctPids.includes(pid) ? 2 : 0;
      });
      applyRoundScores(scores, '記者がネッシーの正体を暴きました！（正解者に2点）');
    } else {
      Object.keys(roomData.players).forEach(pid => {
        scores[pid] = (pid === roomData.state.witnessId) ? 2 : 0;
      });
      applyRoundScores(scores, '正体は永遠の謎となりました！（目撃者に2点）');
    }
  }
}

function handleSubmitInsiderVote(targetPid) {
  roomRef.child('state/votes/' + myPlayerId).set(targetPid).then(() => {
    roomRef.child('state/votes').get().then(snap => {
      const votes = snap.val() || {};
      if (Object.keys(votes).length >= Object.keys(roomData.players).length) {
        roomRef.child('state').update({ phase: 'INSIDER_REVEAL' });
      }
    });
  });
}

function handleResolveInsiderRound(accusedPid) {
  const actualInsiderId = roomData.state.insiderId;
  const witnessId = roomData.state.witnessId;
  const isInsiderCaught = (accusedPid === actualInsiderId);
  const scores = {};

  Object.keys(roomData.players).forEach(pid => {
    if (isInsiderCaught) {
      if (pid === witnessId) scores[pid] = 1;
      else if (pid === actualInsiderId) scores[pid] = 0;
      else scores[pid] = 2;
    } else {
      if (pid === witnessId) scores[pid] = 0;
      else if (pid === actualInsiderId) scores[pid] = 2;
      else scores[pid] = 1;
    }
  });

  const reason = isInsiderCaught ? 
    `インサイダー（${roomData.players[actualInsiderId]?.name}）の特定に成功！` : 
    `インサイダー逃亡！（正解は ${roomData.players[actualInsiderId]?.name} でした）`;

  applyRoundScores(scores, reason);
}

function applyRoundScores(roundScores, reason) {
  const updates = {};
  Object.entries(roundScores).forEach(([pid, pts]) => {
    const cur = roomData.players[pid]?.score || 0;
    updates[`players/${pid}/score`] = cur + pts;
  });

  updates['state/phase'] = 'ROUND_RESULT';
  updates['state/roundSummary'] = { scores: roundScores, reason: reason };
  roomRef.update(updates);
}

function handleNextRoundOrEnd() {
  const curRound = roomData.state.roundNumber;
  const total = Object.keys(roomData.players).length;

  if (curRound >= total) {
    roomRef.child('state').update({ phase: 'SET_COMPLETE' });
  } else {
    startRound(curRound + 1, roomData.state.witnessOrder);
  }
}

function handleLeaveRoom() {
  if (confirm('ルームを退出しますか？')) {
    if (roomRef && myPlayerId) roomRef.child('players/' + myPlayerId).remove();
    currentRoomId = null; roomData = null; render();
  }
}

// 招待URLをクリップボードにコピー
function copyInviteUrl() {
  const inviteUrl = window.location.origin + window.location.pathname + '?room=' + currentRoomId;
  navigator.clipboard.writeText(inviteUrl).then(() => {
    showToast('招待URLをコピーしました！友達に送信してください');
  }).catch(() => {
    copyRoomCode();
  });
}

function copyRoomCode() {
  navigator.clipboard.writeText(currentRoomId).then(() => showToast('ルームコードをコピーしました！'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0');
  t.classList.add('opacity-100');
  setTimeout(() => {
    t.classList.remove('opacity-100');
    t.classList.add('opacity-0');
  }, 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

// 初回起動
render();
</script>
