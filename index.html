function createMarkedDeck() {
  const deck = [];
  ATTRIBUTES.forEach(attr => {
    deck.push({
      category: 'HOW',
      categoryName: '「どんな？」カード',
      attrName: attr.name,
      icon: attr.icon,
      badgeColor: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
      desc: `正体の【${attr.name}】について口頭で質問してください。（例: ${attr.ex}）`
    });
    deck.push({
      category: 'YESNO_MARKED',
      categoryName: 'マークあり「YES / NO」カード',
      attrName: attr.name,
      icon: attr.icon,
      badgeColor: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
      desc: `【${attr.name}】に関連して、目撃者が「YES」か「NO」で答えられる質問を口頭でしてください。`
    });
  });
  return shuffle(deck);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selectCardOption(idx) {
  localSelectedCardIndex = idx;
  render();
}

function handleShareSelectedCard(forceIdx = null) {
  const threeCards = toArray(roomData.state?.threeCards);
  const chosenIdx = forceIdx !== null ? forceIdx : localSelectedCardIndex;
  const selectedCard = threeCards[chosenIdx] || threeCards[0] || FREE_CARD;
  const curHintRound = Number(roomData.state?.hintRound) || 1;
  const queue = toArray(roomData.state?.questionQueue);
  const curIdx = Number(roomData.state?.currentQuestionIndex) || 0;
  const askerId = queue[curIdx] || myPlayerId;

  const updates = {};
  updates['state/phase'] = 'QUESTION_ORAL';
  updates['state/currentQuestionCard'] = selectedCard;
  updates[`state/cardHistory/${curHintRound}/${askerId}`] = selectedCard;

  roomRef.update(updates);
}

function handleFinishQuestionTurn() {
  const queue = toArray(roomData.state?.questionQueue);
  const curIdx = Number(roomData.state?.currentQuestionIndex) || 0;
  const nextIdx = curIdx + 1;
  const isEnd = nextIdx >= queue.length;
  const currentCard = roomData.state?.currentQuestionCard || FREE_CARD;

  if (isEnd) {
    localTyping.inference = '';
    roomRef.child('state').update({
      phase: 'INFERENCE_INPUT',
      inferences: {},
      lastUsedCard: currentCard,
      currentQuestionCard: null
    });
  } else {
    const drawn = drawThreeCards(roomData.state?.markedDeck || []);
    localSelectedCardIndex = 0;
    roomRef.child('state').update({
      phase: 'QUESTION_CHOOSE',
      currentQuestionIndex: nextIdx,
      threeCards: drawn.cards,
      markedDeck: drawn.deck,
      lastUsedCard: currentCard,
      currentQuestionCard: null
    });
  }
}

/**
 * 13. 最終ランキング
 */
function renderSetCompleteScreen() {
  const isHost = roomData.hostId === myPlayerId;
  const isNormal = roomData.mode === 'NORMAL';
  const players = Object.values(roomData.players || {});
  
  if (isNormal) {
    players.sort((a, b) => (b.correctCount || 0) - (a.correctCount || 0));
  } else {
    players.sort((a, b) => (b.score || 0) - (a.score || 0));
  }

  let currentRank = 1;
  const rankedList = players.map((p, idx) => {
    const val = isNormal ? (p.correctCount || 0) : (p.score || 0);
    const prevVal = idx > 0 ? (isNormal ? (players[idx - 1].correctCount || 0) : (players[idx - 1].score || 0)) : null;
    if (idx > 0 && val < prevVal) currentRank = idx + 1;
    const isMe = p.id === myPlayerId;

    return `
      <div class="flex items-center justify-between p-3.5 rounded-2xl ${
        currentRank === 1 ? 'bg-amber-950/40 border border-amber-500/60' :
        isMe ? 'bg-emerald-950/40 border border-emerald-700/60' : 'bg-slate-900 border border-slate-800'
      }">
        <div class="flex items-center gap-3">
          <span class="font-black text-lg w-6 text-center ${currentRank === 1 ? 'text-amber-400 text-xl' : 'text-slate-400'}">
            ${currentRank === 1 ? '👑' : currentRank}
          </span>
          <span class="font-bold text-sm ${isMe ? 'text-emerald-300' : 'text-slate-200'}">${escapeHtml(p.name)}</span>
        </div>
        <div class="font-mono font-black text-amber-400 text-base">
          ${val} <span class="text-xs font-normal text-slate-400">${isNormal ? '問正解' : '点'}</span>
        </div>
      </div>
    `;
  }).join('');

  appEl.innerHTML = `
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl shadow-2xl space-y-6 text-center">
      <div>
        <span class="text-5xl">🏆</span>

          もう1セット遊ぶ
        </button>
      ` : ''}
    </div>
  `;
}

/**
 * -------------------------------------------------------------
 * ネットワーク＆ロジック操作
 * -------------------------------------------------------------
 */
function handleCreateRoom() {
  const name = document.getElementById('inputPlayerName').value.trim();
  if (!name) return showToast('名前を入力してください');
  myName = name;
  localStorage.setItem('nessie_pname', myName);

  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  currentRoomId = code;
  roomRef = db.ref('rooms/' + code);

  roomRef.set({
    code: code,
    hostId: myPlayerId,
    mode: 'NORMAL',
    state: { phase: 'LOBBY' },
    players: { [myPlayerId]: { id: myPlayerId, name: myName, score: 0, correctCount: 0, online: true } }
  }).then(() => attachRoomListener()).catch(e => showToast(e.message));
}

function handleJoinRoom() {
  const name = document.getElementById('inputPlayerName').value.trim();
  const code = document.getElementById('inputRoomCode').value.trim().toUpperCase();
  if (!name) return showToast('名前を入力してください');
  if (!code || code.length !== 6) return showToast('6桁のコードを入力してください');

  myName = name;
  localStorage.setItem('nessie_pname', myName);
  currentRoomId = code;
  roomRef = db.ref('rooms/' + code);

  roomRef.get().then(snap => {
    if (!snap.exists()) return showToast('ルームが見つかりません');
    const data = snap.val();
    if (Object.keys(data.players || {}).length >= 8 && !data.players[myPlayerId]) return showToast('満員です');

    roomRef.child('players/' + myPlayerId).set({
      id: myPlayerId,
      name: myName,
      score: data.players?.[myPlayerId]?.score || 0,
      correctCount: data.players?.[myPlayerId]?.correctCount || 0,
      online: true
    }).then(() => attachRoomListener());
  }).catch(e => showToast(e.message));
}

function attachRoomListener() {
  roomRef.child('players/' + myPlayerId).onDisconnect().update({ online: false });

  roomRef.on('value', snap => {
    if (!snap.exists()) {
      showToast('ルームが解散されました');
      currentRoomId = null; roomData = null; render(); return;
    }
    roomData = snap.val();

    if (!roomData.players[roomData.hostId]?.online) {
      const activeIds = Object.keys(roomData.players).filter(id => roomData.players[id].online);
      if (activeIds.length > 0 && activeIds[0] === myPlayerId) {
        roomRef.update({ hostId: myPlayerId });
      }
    }
    render();
  });
}

function setGameMode(mode) {
  if (roomData.hostId !== myPlayerId) return;
  roomRef.update({ mode: mode });
}

function handleStartGameSet() {
  const pids = Object.keys(roomData.players || {});
  if (pids.length < 4) return showToast('4人以上必要です');

  const updates = {};
  pids.forEach(pid => {
    updates[`players/${pid}/score`] = 0;
    updates[`players/${pid}/correctCount`] = 0;
  });
  roomRef.update(updates).then(() => {
    startNewWitnessGame([]);
  });
}

function startNewWitnessGame(playedWitnesses = []) {
  const allPids = Object.keys(roomData.players || {});
  const remainingWitnesses = allPids.filter(pid => !playedWitnesses.includes(pid));

  if (remainingWitnesses.length === 0) {
    roomRef.child('state').update({ phase: 'SET_COMPLETE' });
    return;
  }

  const nextWitnessId = remainingWitnesses[Math.floor(Math.random() * remainingWitnesses.length)];
  const newPlayedList = [...playedWitnesses, nextWitnessId];

  const nonWitnesses = allPids.filter(pid => pid !== nextWitnessId);
  const insiderId = nonWitnesses[Math.floor(Math.random() * nonWitnesses.length)];

  localSuggestedTopics = getRandomTopics(3);
  localTyping.secretWord = '';

  roomRef.update({
    'state': {
      phase: 'SETUP',
      hintRound: 1,
      playedWitnesses: newPlayedList,
      witnessId: nextWitnessId,
      insiderId: insiderId,
      secretWord: '',
      boatPos: 0,
      markedDeck: createMarkedDeck(),
      currentQuestionIndex: 0,
      threeCards: [],
      inferences: {},
      history: [],
      cardHistory: {},
      guesserVotes: {},
      votes: {},
      secretRevealed: false
    }
  });
}

function submitSetup() {
  const word = localTyping.secretWord.trim();
  if (!word) return showToast('正体の言葉を入力するか候補を選んでください');

  const pids = Object.keys(roomData.players || {});
  const witnessId = roomData.state.witnessId;
  const nonWitnesses = pids.filter(id => id !== witnessId);
  const queue = shuffle(nonWitnesses).slice(0, Math.min(3, nonWitnesses.length));

  const drawnCards = drawThreeCards(roomData.state.markedDeck || []);

  localSelectedCardIndex = 0;
  roomRef.child('state').update({
    phase: 'QUESTION_CHOOSE',
    secretWord: word,
    boatPos: 0,
    questionQueue: queue,
    currentQuestionIndex: 0,
    threeCards: drawnCards.cards,
    markedDeck: drawnCards.deck,
    currentQuestionCard: null,
    inferences: {},
    secretRevealed: false
  });
}

function drawThreeCards(deck) {
  let curDeck = toArray(deck);
  if (curDeck.length < 2) curDeck = createMarkedDeck();

  const c1 = curDeck.pop();
  const c2 = curDeck.pop();
  return {
    cards: [FREE_CARD, c1, c2],
    deck: curDeck
  };
}

function handleSubmitInference() {
  const text = localTyping.inference.trim();
  if (!text) return showToast('推理を入力してください');

  roomRef.child('state/inferences/' + myPlayerId).set({
    name: myName,
    text: text,
    isCorrect: null,
    isClosest: false
  }).then(() => {
    roomRef.child('state/inferences').get().then(snap => {
      const infs = snap.val() || {};
      const reporters = Object.keys(roomData.players || {}).filter(id => id !== roomData.state.witnessId);
      if (Object.keys(infs).length >= reporters.length) {
        roomRef.child('state').update({ phase: 'INFERENCE_JUDGE' });
      }
    });
  });
}

function toggleJudgeCorrect(targetPid, boolVal) {
  roomRef.child(`state/inferences/${targetPid}`).update({ isCorrect: boolVal });
}

function setClosestAnswer(targetPid) {
  const inferences = roomData.state.inferences || {};
  const updates = {};
  Object.keys(inferences).forEach(pid => {
    updates[`state/inferences/${pid}/isClosest`] = (pid === targetPid);
  });
  roomRef.update(updates);
}

function finishJudging() {
  const inferences = roomData.state.inferences || {};
  const hasUnjudged = Object.values(inferences).some(inf => inf.isCorrect === null);
  if (hasUnjudged) return showToast('全員の回答に⭕または❌をつけてください');

  let closestText = '';
  Object.entries(inferences).forEach(([pid, inf]) => {
    if (inf.isClosest) closestText = inf.text;
  });

  const curPos = Number(roomData.state.boatPos) || 0;
  const dist = 10 - curPos;
  const distanceText = dist <= 0 ? '到達！' : `残り ${dist}m`;

  const currentHistory = toArray(roomData.state?.history);
  const newLogEntry = {
    hintRound: roomData.state.hintRound,
    inferences: inferences,
    closestText: closestText,
    distanceText: distanceText
  };
  const updatedHistory = [...currentHistory, newLogEntry];

  const hasCorrect = Object.values(inferences).some(inf => inf.isCorrect === true);

  if (hasCorrect) {
    roomRef.child('state').update({
      boatPos: 10,
      phase: 'SCOOP_VOTE_GUESSER',
      guesserVotes: {},
      history: updatedHistory
    });
  } else {
    roomRef.child('state').update({
      phase: 'SHIP_MOVE',
      history: updatedHistory
    });
  }
}

function handleAdjustBoat(delta) {
  const cur = Number(roomData.state.boatPos) || 0;
  const next = Math.max(0, Math.min(10, cur + delta));
  roomRef.child('state/boatPos').set(next);
}

function confirmBoatMoveAndProceed() {
  const curHintRound = Number(roomData.state.hintRound) || 1;

  if (curHintRound >= 5) {
    // 5ヒント終了で正解が出なかった場合
    if (roomData.mode === 'INSIDER') {
      // インサイダーモード：正体未発表でも必ずインサイダー特定（投票）へ進む！
      roomRef.child('state').update({
        secretRevealed: false,
        phase: 'INSIDER_VOTE',
        votes: {}
      });
    } else {
      // 通常ネッシーモード：終了
      applyRoundResults(false, []);
    }
  } else {
    const pids = Object.keys(roomData.players || {});
    const nonWitnesses = pids.filter(id => id !== roomData.state.witnessId);
    const queue = shuffle(nonWitnesses).slice(0, Math.min(3, nonWitnesses.length));
    const drawn = drawThreeCards(roomData.state.markedDeck || []);

    localSelectedCardIndex = 0;
    roomRef.child('state').update({
      phase: 'QUESTION_CHOOSE',
      hintRound: curHintRound + 1,
      questionQueue: queue,
      currentQuestionIndex: 0,
      threeCards: drawn.cards,
      markedDeck: drawn.deck,
      currentQuestionCard: null,
      inferences: {}
    });
  }
}

function handleSubmitGuesserVote(targetPid) {
  roomRef.child('state/guesserVotes/' + myPlayerId).set(targetPid).then(() => {
    roomRef.child('state/guesserVotes').get().then(snap => {
      const votes = snap.val() || {};
      const reporterCount = Object.keys(roomData.players || {}).length - 1;
      if (Object.keys(votes).length >= reporterCount) {
        roomRef.child('state').update({ phase: 'SCOOP_RESULT_GUESSER' });
      }
    });
  });
}

function handleProceedAfterGuesserVote(isGuesserIdentified) {
  const correctPids = Object.entries(roomData.state.inferences || {})
    .filter(([_, inf]) => inf.isCorrect)
    .map(([pid]) => pid);

  if (roomData.mode === 'INSIDER') {
    // インサイダーモード：正体発表あり/なしを記録してインサイダー投票へ進む！
    roomRef.child('state').update({
      secretRevealed: isGuesserIdentified,
      phase: 'INSIDER_VOTE',
      votes: {}
    });
  } else {
    applyRoundResults(isGuesserIdentified, correctPids);
  }
}

function handleSubmitInsiderVote(targetPid) {
  roomRef.child('state/votes/' + myPlayerId).set(targetPid).then(() => {
    roomRef.child('state/votes').get().then(snap => {
      const votes = snap.val() || {};
      if (Object.keys(votes).length >= Object.keys(roomData.players).length) {
        roomRef.child('state').update({ phase: 'INSIDER_REVEAL' });
      }
    });
  });
}

function handleResolveInsiderRound(accusedPid) {
  const actualInsiderId = roomData.state.insiderId;
  const isInsiderCaught = (accusedPid === actualInsiderId);
  const secretRevealed = !!roomData.state.secretRevealed;
  applyNewInsiderScores(secretRevealed, isInsiderCaught);
}

/**
 * 画像に基づくインサイダーモード新得点計算（基本得点 ＋ 個人ボーナス）
 */
function applyNewInsiderScores(hasSecretRevealed, isInsiderCaught) {
  const actualInsiderId = roomData.state.insiderId;
  const witnessId = roomData.state.witnessId;
  const pids = Object.keys(roomData.players);
  const votes = roomData.state.votes || {};

  // 正体を正解した通常記者（インサイダー以外）
  const correctRegularReporters = Object.entries(roomData.state.inferences || {})
    .filter(([pid, inf]) => inf.isCorrect && pid !== witnessId && pid !== actualInsiderId)
    .map(([pid]) => pid);

  const roundScores = {};
  const scoreDetails = {};
  pids.forEach(pid => {
    roundScores[pid] = 0;
    scoreDetails[pid] = [];
  });

  // 1. 基本得点（4パターン）
  let patternText = '';
  if (hasSecretRevealed && !isInsiderCaught) {
    // ① 正体発表あり・インサイダー潜伏成功 (目撃者:0, 通常記者:+1, インサイダー:+3)
    patternText = '① 正体発表あり・インサイダー潜伏成功';
    pids.forEach(pid => {
      if (pid === actualInsiderId) {
        roundScores[pid] += 3;
        scoreDetails[pid].push('基本点: +3');
      } else if (pid !== witnessId) {
        roundScores[pid] += 1;
        scoreDetails[pid].push('基本点: +1');
      } else {
        scoreDetails[pid].push('基本点: 0');
      }
    });
  } else if (hasSecretRevealed && isInsiderCaught) {
    // ② 正体発表あり・インサイダー発覚 (目撃者:0, 通常記者:+1, インサイダー:-1)
    patternText = '② 正体発表あり・インサイダー発覚';
    pids.forEach(pid => {
      if (pid === actualInsiderId) {
        roundScores[pid] -= 1;
        scoreDetails[pid].push('基本点: -1');
      } else if (pid !== witnessId) {
        roundScores[pid] += 1;
        scoreDetails[pid].push('基本点: +1');
      } else {
        scoreDetails[pid].push('基本点: 0');
      }
    });
  } else if (!hasSecretRevealed && !isInsiderCaught) {
    // ③ 正体発表なし・インサイダー潜伏成功 (全員0点)
    patternText = '③ 正体発表なし・インサイダー潜伏成功';
    pids.forEach(pid => {
      scoreDetails[pid].push('基本点: 0');
    });
  } else {
    // ④ 正体発表なし・インサイダー発覚 (目撃者:0, 通常記者:0, インサイダー:-2)
    patternText = '④ 正体発表なし・インサイダー発覚';
    pids.forEach(pid => {
      if (pid === actualInsiderId) {
        roundScores[pid] -= 2;
        scoreDetails[pid].push('基本点: -2');
      } else {
        scoreDetails[pid].push('基本点: 0');
      }
    });
  }

  // 2. 個人ボーナス加算
  // ボーナスA: 正体を正解した通常記者 (+1点)
  if (hasSecretRevealed) {
    correctRegularReporters.forEach(pid => {
      roundScores[pid] += 1;
      scoreDetails[pid].push('正解ボーナス: +1');
    });
  }

  // ボーナスB: インサイダーを正しく指名した人 (+1点)（目撃者・通常記者が対象）
  Object.entries(votes).forEach(([voterPid, targetPid]) => {
    if (voterPid !== actualInsiderId && targetPid === actualInsiderId) {
      roundScores[voterPid] += 1;
      scoreDetails[voterPid].push('指名ボーナス: +1');
    }
  });

  const finalDetails = {};
  pids.forEach(pid => {
    finalDetails[pid] = scoreDetails[pid].join(' / ');
  });

  // スコアの更新
  const updates = {};
  pids.forEach(pid => {
    const cur = roomData.players[pid]?.score || 0;
    updates[`players/${pid}/score`] = cur + roundScores[pid];
  });

  updates['state/phase'] = 'ROUND_RESULT';
  updates['state/roundSummary'] = {
    scores: roundScores,
    scoreDetails: finalDetails,
    reason: `${patternText} （インサイダー: ${roomData.players[actualInsiderId]?.name}）`
  };

  roomRef.update(updates);
}

function applyRoundResults(isSuccess, correctPids) {
  const updates = {};
  const reason = isSuccess ? 
    '記者がネッシーの正体を暴きました！（正解数を加算）' : 
    '正体は永遠の謎となりました！（正解者なし）';

  if (isSuccess) {
    correctPids.forEach(pid => {
      const cur = roomData.players[pid]?.correctCount || 0;
      updates[`players/${pid}/correctCount`] = cur + 1;
    });
  }

  updates['state/phase'] = 'ROUND_RESULT';
  updates['state/roundSummary'] = { reason: reason };
  roomRef.update(updates);
}

function handleNextRoundOrEnd() {
  const played = toArray(roomData.state?.playedWitnesses);
  startNewWitnessGame(played);
}

function handleLeaveRoom() {
  if (confirm('ルームを退出しますか？')) {
    if (roomRef && myPlayerId) roomRef.child('players/' + myPlayerId).remove();
    currentRoomId = null; roomData = null; render();
  }
}

function copyInviteUrl() {
  const inviteUrl = window.location.origin + window.location.pathname + '?room=' + currentRoomId;
  navigator.clipboard.writeText(inviteUrl).then(() => showToast('招待URLをコピーしました！')).catch(() => copyRoomCode());
}

function copyRoomCode() {
  navigator.clipboard.writeText(currentRoomId).then(() => showToast('ルームコードをコピーしました！'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('opacity-0');
  t.classList.add('opacity-100');
  setTimeout(() => {
    t.classList.remove('opacity-100');
    t.classList.add('opacity-0');
  }, 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

// 起動
render();
</script>
